# Local Postgres for development and tests. The deployed database is on Neon.
# Host port 5433, so it does not clash with another Postgres on 5432.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: minos
      POSTGRES_PASSWORD: minos
      POSTGRES_DB: minos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minos -d minos"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
