[project]
name = "minos-api"
version = "0.1.0"
description = "Minos API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
