name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Same Postgres as docker-compose.yml, so migrations are checked on every PR.
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: minos
          POSTGRES_PASSWORD: minos
          POSTGRES_DB: minos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U minos -d minos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://minos:minos@localhost:5433/minos
    steps:
      - uses: actions/checkout@v4
      # Reads the Python version from apps/api/.python-version.
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: apps/api
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # pnpm comes from the packageManager field in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
